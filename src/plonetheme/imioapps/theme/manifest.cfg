[theme]
title = iMio applications
description = Plone 6.1 Classic UI theme for the iMio applications
preview = preview.png
rules = /++theme++imioapps/rules.xml
prefix = /++theme++imioapps
doctype = <!DOCTYPE html>
enabled-bundles =
disabled-bundles =

# rules.xml is a copy of plonetheme.barceloneta 3.3.4. index.html is the
# same copy with the logo moved inside the navbar, so the brand, the
# sections and the search share one bar. Keep the npm pin of
# @plone/plonetheme-barceloneta-base at the same version as the egg, and
# resync both files when the egg moves.
development-css = ++theme++imioapps/styles/theme.css
production-css = ++theme++imioapps/styles/theme.min.css
tinymce-content-css = /++theme++imioapps/styles/theme.min.css
development-js =
production-js =

[theme:parameters]
ajax_load = python:request.get('ajax_load')
portal_url = portal_state/portal_url
